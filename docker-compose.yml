services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-diagnostic_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Expires unpaid bookings past their hold and settles payments stuck in PENDING, once a
  # minute. Started after the API so that the API container has applied the migrations.
  maintenance:
    build: .
    env_file: .env
    entrypoint: []
    command: ["python", "-m", "app.scripts.maintenance", "--every", "60"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
